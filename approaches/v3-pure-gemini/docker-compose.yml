services:
  # Backend API (Kokoro TTS + Gemini extraction)
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DEBUG=true
    volumes:
      - ./backend:/app
      - pdf_uploads:/tmp/pdf-to-speech
      - kokoro_cache:/root/.cache  # Cache Kokoro model downloads
    # GPU support - comment out if no NVIDIA GPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - api

volumes:
  pdf_uploads:
  kokoro_cache:
